apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-db
  template:
    metadata:
      labels:
        app: app-db
    spec:
      containers:
        - name: dbcont1
          image: nagashankar8916/eks2:dbimg
          ports:
            - containerPort: 3306
        # secret 
          envFrom:
            - secretRef:
                name: bank-secret
        # resource
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits: 
              cpu: "200m"
              memory: "256Mi"
        #volume
          volumeMounts:
            - name: pvc-1
              mountPath: /var/lib/mysql
      volumes:
        - name: pvc-1
          persistentvolumeClaim:
            claimName: pvc-1
